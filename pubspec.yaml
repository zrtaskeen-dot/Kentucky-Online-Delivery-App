name: animation
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  provider: ^6.1.2
  google_maps_flutter: ^2.5.0
  geolocator: ^12.0.0
  geocoding: ^3.0.0
  video_player: ^2.7.0
  lottie: ^3.1.0
  font_awesome_flutter: ^10.1.0 
  latlong2: ^0.9.1
  firebase_core: ^3.4.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_messaging: ^15.2.10
  google_mlkit_text_recognition: ^0.15.1
  flutter_local_notifications: ^19.0.0
  shared_preferences: ^2.2.2

  google_sign_in: ^6.2.1
  flutter_signin_button: ^2.0.0
  crypto: ^3.0.3
  url_launcher: ^6.1.12
  http: ^1.2.0
  flutter_map: ^6.1.0
  

  cupertino_icons: ^1.0.8
  flutter_stripe: ^12.6.0
  image_picker: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/order.png

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/logo.png"